name: Build APK for Pixel 10

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Project, Install & Build APK
        run: |
          # البحث التلقائي عن مسار مجلد التطبيق
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "تم العثور على المشروع في المسار: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KD-Catalog-Pixel10-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
